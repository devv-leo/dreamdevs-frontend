<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Educlass</title>
    <link rel="icon" href="images/icon.png">
</head>
<body>
    <header class="header">
        <div class="container">
            <div class="logo">
                <img src="images/Logo.png" alt="Educlass Logo">
            </div>
            <nav>
                <a href="#home">Home</a>
                <a href="#about">About</a>
                <a href="#features">Features</a>
                <a href="#pricing">Pricing</a>
                <a href="#testimonials">Testimonials</a>
            </nav>
            <button>Contact Us</button>
        </div>
    </header>

    <main>
        <div class="container">
            <div class="hero-content">
                <h1>Modern<br>Solution for<br><span class="highlight">Education</span></h1>
                <p>Streamline your educational strategy with our innovative learning by dashboards. Track student performance, attendance rates, test scores, and more.</p>
                <div class="cta-buttons">
                    <button>Try Free Trial</button>
                    <a href="#" class="btn-demo">
                        <span class="demo-icon">▶</span>
                        View Demo
                    </a>
                </div>
            </div>
            
        </div>
        
        <img src="images/Dashboard.png" alt="Educlass Dashboard">
    </main>

    <section class="container">
        <img src="images/about.png" alt="About Educlass">
    </section>

    <section class="container">
        <img src="images/Features.png" alt="Features">
    </section>

    <section class="testimonials">
        <div>
            <img src="images/Testimonial.png" alt="Testimonial">
        </div>
    </section>

    <section class="container">
        <img src="images/Pricing.png" alt="Pricing">
    </section>

    <section class="footer">
        <div>
            <img src="images/Footer.png" alt="Footer">
        </div>
    </section>
</body>
</html>
