<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Base Apparel</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:ital,wght@0,100..700;1,100..700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">

        <section class="panel left-panel">
        
            <header class="brand">
                <span class="icon"></span>
                <div class="brand-name">BASE <br> APPAREL</div>
            </header>
        
            <div class="hero-text">
                <span class="small-title">WE'RE</span>
                <h1>COMING<br>SOON</h1>
            </div>
        
            <p class="description">Hello fellow shoppers! We’re currently building our new fashion store. Add your email below to stay up-to-date with announcements and our launch deals.</p>
        
            <form class="email-form" action="#" method="POST" novalidate>
                <input type="email" name="email" placeholder="Email Address" required>
                <button type="submit" aria-label="Submit email">→</button>
            </form>
        
        </section>

        <section class="panel right-panel">
            <img src="Bitmap.png" alt="Model wearing outfit">
        </section>
    </div>
</body>
</html>
